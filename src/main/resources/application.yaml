spring.application:
  name: spring-data-jpa-pagination

spring.threads.virtual.enabled: true

spring.datasource:
  url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/spring-data-jpa-pagination?reWriteBatchedInserts=true}
  username: ${DATASOURCE_USERNAME:user}
  password: ${DATASOURCE_PASSWORD:1234}

spring.jpa:
  hibernate.ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.properties.hibernate.jdbc.batch_size: ${person-seeder.chunk-size}
spring.jpa.properties.hibernate.order_inserts: true

spring.web.error:
  include-message: always

person-seeder:
  person-count: 1_000_000
  product-per-person: 2
  chunk-size: 25_000
  enabled: true

