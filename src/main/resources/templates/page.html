<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Persons - Page Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<nav class="mb-3">
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/page}">Page</a>
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/slice}">Slice</a>
    <a class="btn btn-outline-primary"
       th:href="@{/persons/view/window}">Window</a>
</nav>

<h1>Persons (Page Pagination with Count)</h1>

<form class="row g-3 mb-3" method="get" th:action="@{/persons/view/page}">
    <input type="hidden" name="page" value="1"/>

    <div class="col-auto">
        <label for="fullName" class="col-form-label">Name:</label>
    </div>
    <div class="col-auto">
        <input id="fullName" type="text" class="form-control" name="fullName"
               th:value="${filter.fullName}" placeholder="Search by name"/>
    </div>

    <div class="col-auto">
        <label for="birthDateFrom" class="col-form-label">Birth from:</label>
    </div>
    <div class="col-auto">
        <input id="birthDateFrom" type="date" class="form-control" name="birthDateFrom"
               th:value="${filter.birthDateFrom}"/>
    </div>

    <div class="col-auto">
        <label for="birthDateTo" class="col-form-label">Birth to:</label>
    </div>
    <div class="col-auto">
        <input id="birthDateTo" type="date" class="form-control" name="birthDateTo"
               th:value="${filter.birthDateTo}"/>
    </div>

    <div class="col-auto">
        <button type="submit" class="btn btn-primary">Search</button>
    </div>
    <div class="col-auto">
        <a class="btn btn-secondary" th:href="@{/persons/view/page(page=1, size=${page.size}, variant=${variant})}">Clear</a>
    </div>

    <div class="col-auto">
        <label for="variant" class="col-form-label">Version:</label>
    </div>
    <div class="col-auto">
        <select id="variant" name="variant" class="form-select" onchange="this.form.submit()">
            <option value="summary" th:selected="${variant == 'summary'}">summary</option>
            <option value="summaryCustomCount" th:selected="${variant == 'summaryCustomCount'}">summaryCustomCount</option>
            <option value="improvedSummary" th:selected="${variant == 'improvedSummary'}">improvedSummary</option>
            <option value="summaryWithoutCount" th:selected="${variant == 'summaryWithoutCount'}">summaryWithoutCount</option>
        </select>
    </div>
</form>

<div class="mb-3">
    <p>
        Page
        <span th:text="${page.number + 1}">1</span>
        of
        <span th:text="${page.totalPages}">1</span>
        |
        Total persons:
        <span th:text="${page.totalElements}">0</span>
    </p>
</div>

<table class="table table-striped table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>First name</th>
        <th>Last name</th>
        <th>Product count</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="person : ${page.content}">
        <td th:text="${person.id}">1</td>
        <td th:text="${person.firstName}">John</td>
        <td th:text="${person.lastName}">Doe</td>
        <td th:text="${person.productCount}">3</td>
    </tr>
    </tbody>
</table>

<nav aria-label="Page navigation">
    <ul class="pagination">

        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/persons/view/page(page=${1}, size=${page.size}, variant=${variant}, fullName=${filter.fullName}, birthDateFrom=${filter.birthDateFrom}, birthDateTo=${filter.birthDateTo})}">
                First
            </a>
        </li>

        <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/persons/view/page(page=${page.number}, size=${page.size}, variant=${variant}, fullName=${filter.fullName}, birthDateFrom=${filter.birthDateFrom}, birthDateTo=${filter.birthDateTo})}">
                Previous
            </a>
        </li>

        <!-- First numbered page and leading ellipsis -->
        <li class="page-item" th:if="${startPage > 0}">
            <a class="page-link"
               th:href="@{/persons/view/page(page=${1}, size=${page.size}, variant=${variant}, fullName=${filter.fullName}, birthDateFrom=${filter.birthDateFrom}, birthDateTo=${filter.birthDateTo})}">1</a>
        </li>
        <li class="page-item disabled" th:if="${startPage > 1}">
            <span class="page-link">...</span>
        </li>

        <!-- Main window of page numbers -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(startPage, endPage)}"
            th:classappend="${i} == ${page.number} ? 'active'">
            <a class="page-link"
               th:href="@{/persons/view/page(page=${i + 1}, size=${page.size}, variant=${variant}, fullName=${filter.fullName}, birthDateFrom=${filter.birthDateFrom}, birthDateTo=${filter.birthDateTo})}"
               th:text="${i + 1}">1</a>
        </li>

        <!-- Trailing ellipsis and last numbered page -->
        <li class="page-item disabled" th:if="${endPage < page.totalPages - 2}">
            <span class="page-link">...</span>
        </li>
        <li class="page-item" th:if="${endPage < page.totalPages - 1}">
            <a class="page-link"
               th:href="@{/persons/view/page(page=${page.totalPages}, size=${page.size}, variant=${variant}, fullName=${filter.fullName}, birthDateFrom=${filter.birthDateFrom}, birthDateTo=${filter.birthDateTo})}"
               th:text="${page.totalPages}">10</a>
        </li>

        <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/persons/view/page(page=${page.number + 2}, size=${page.size}, variant=${variant}, fullName=${filter.fullName}, birthDateFrom=${filter.birthDateFrom}, birthDateTo=${filter.birthDateTo})}">
                Next
            </a>
        </li>

        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/persons/view/page(page=${page.totalPages}, size=${page.size}, variant=${variant}, fullName=${filter.fullName}, birthDateFrom=${filter.birthDateFrom}, birthDateTo=${filter.birthDateTo})}">
                Last
            </a>
        </li>

    </ul>
</nav>

<form class="d-flex align-items-center gap-2 mt-2" method="get" th:action="@{/persons/view/page}">
    <label for="pageInput" class="col-form-label me-2">Go to page:</label>
    <input id="pageInput" type="number" class="form-control"
           name="page"
           min="1"
           th:attr="max=${page.totalPages}"
           th:value="${page.number + 1}"
           style="width: 120px;"/>
    <input type="hidden" name="size" th:value="${page.size}"/>
    <input type="hidden" name="variant" th:value="${variant}"/>
    <input type="hidden" name="fullName" th:value="${filter.fullName}"/>
    <input type="hidden" name="birthDateFrom" th:value="${filter.birthDateFrom}"/>
    <input type="hidden" name="birthDateTo" th:value="${filter.birthDateTo}"/>
    <button type="submit" class="btn btn-secondary">Go</button>
</form>

</body>
</html>
