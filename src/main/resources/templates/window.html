<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Persons - Window (Cursor) Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4 d-flex flex-column" style="height: 100vh;">

<nav class="mb-3">
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/page}">Page</a>
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/slice}">Slice</a>
    <a class="btn btn-outline-primary"
       th:href="@{/persons/view/window}">Window</a>
</nav>

<h1>Persons (Keyset / Cursor Pagination)</h1>

<form class="row g-3 mb-3" method="get" th:action="@{/persons/view/window}">
    <input type="hidden" name="lastSeenId" value=""/>
    <div class="col-auto">
        <label for="fullName" class="col-form-label">Name:</label>
    </div>
    <div class="col-auto">
        <input id="fullName" type="text" class="form-control" name="fullName"
               th:value="${filter.fullName}" placeholder="Search by name"/>
    </div>

    <div class="col-auto">
        <label for="birthDateFrom" class="col-form-label">Birth from:</label>
    </div>
    <div class="col-auto">
        <input id="birthDateFrom" type="date" class="form-control" name="birthDateFrom"
               th:value="${filter.birthDateFrom}"/>
    </div>

    <div class="col-auto">
        <label for="birthDateTo" class="col-form-label">Birth to:</label>
    </div>
    <div class="col-auto">
        <input id="birthDateTo" type="date" class="form-control" name="birthDateTo"
               th:value="${filter.birthDateTo}"/>
    </div>

    <div class="col-auto">
        <button type="submit" class="btn btn-primary">Search</button>
    </div>
    <div class="col-auto">
        <a class="btn btn-secondary"
           th:href="@{/persons/view/window(variant=${variant})}">Clear</a>
    </div>
    <div class="col-auto">
        <label for="variant" class="col-form-label">Version:</label>
    </div>
    <div class="col-auto">
        <select id="variant" name="variant" class="form-select" onchange="this.form.submit()">
            <option value="manualKeyset" th:selected="${variant == 'manualKeyset'}">manualKeyset</option>
            <option value="autoKeyset" th:selected="${variant == 'autoKeyset'}">autoKeyset</option>
        </select>
    </div>
</form>

<div class="mb-3">
    <p>
        Cursor-based window (no total count, using <code>lastSeenId</code>)
    </p>
</div>

<div id="person-table-container"
     class="mt-3 flex-grow-1 overflow-auto"
     style="min-height: 0;">
    <table class="table table-striped table-bordered mb-0">
        <thead>
        <tr>
            <th>ID</th>
            <th>First name</th>
            <th>Last name</th>
            <th>Birth date</th>
            <th>Product count</th>
        </tr>
        </thead>
        <tbody id="person-table-body"
               th:attr="data-variant=${variant},data-next-cursor=${nextCursor},data-has-next=${hasNext},data-full-name=${filter.fullName},data-birth-date-from=${filter.birthDateFrom},data-birth-date-to=${filter.birthDateTo}">
        <tr th:each="person : ${items}">
            <td th:text="${person.id}">1</td>
            <td th:text="${person.firstName}">John</td>
            <td th:text="${person.lastName}">Doe</td>
            <td th:text="${person.birthDate}">—</td>
            <td th:text="${person.productCount}">3</td>
        </tr>
        </tbody>
    </table>

    <p class="text-muted mt-2">Scroll down to load more results.</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    console.log('[window.html] DOMContentLoaded fired');

    const tbody = document.getElementById('person-table-body');
    if (!tbody) {
        console.log('[window.html] tbody#person-table-body not found');
        return;
    }

    const scrollContainer = document.getElementById('person-table-container') || window;

    let loading = false;
    let hasNext = tbody.dataset.hasNext === 'true';
    let nextCursor = tbody.dataset.nextCursor || null;
    const variant = tbody.dataset.variant || 'manualKeyset';
    const fullName = tbody.dataset.fullName || '';
    const birthDateFrom = tbody.dataset.birthDateFrom || '';
    const birthDateTo = tbody.dataset.birthDateTo || '';
    const loadThreshold = 200; // px from bottom to start loading

    const initialHeight = scrollContainer === window
        ? document.body.offsetHeight
        : scrollContainer.scrollHeight;
    const viewportHeight = scrollContainer === window
        ? window.innerHeight
        : scrollContainer.clientHeight;

    console.log('[window.html] initial state', {
        hasNext,
        nextCursor,
        loadThreshold,
        initialHeight,
        viewportHeight
    });

    async function loadNextPage(source) {
        console.log('[window.html] loadNextPage called', {
            source,
            hasNext,
            loading,
            nextCursor
        });

        if (!hasNext || loading || !nextCursor) {
            console.log('[window.html] loadNextPage aborted', {
                reason: !hasNext ? 'no-more-pages' : (!nextCursor ? 'no-cursor' : 'already-loading')
            });
            return;
        }

        loading = true;
        try {
            const params = new URLSearchParams();
            params.set('lastSeenId', nextCursor);
            if (variant === 'manualKeyset') {
                if (fullName) {
                    params.set('fullName', fullName);
                }
                if (birthDateFrom) {
                    params.set('birthDateFrom', birthDateFrom);
                }
                if (birthDateTo) {
                    params.set('birthDateTo', birthDateTo);
                }
            }

            const endpoint = variant === 'autoKeyset'
                ? '/persons/window-auto-keyset'
                : '/persons/window-manual-keyset';
            const url = endpoint + '?' + params.toString();
            console.log('[window.html] fetching', url);
            const resp = await fetch(url);
            console.log('[window.html] fetch response', { status: resp.status });

            if (!resp.ok) {
                console.log('[window.html] response not ok, stopping further loads');
                hasNext = false;
                return;
            }

            const data = await resp.json();
            console.log('[window.html] parsed JSON', data);

            const items = Array.isArray(data.content) ? data.content : [];
            console.log('[window.html] items received', { count: items.length });

            if (items.length === 0) {
                console.log('[window.html] empty page, stopping further loads');
                hasNext = false;
                nextCursor = null;
                return;
            }

            for (const person of items) {
                const tr = document.createElement('tr');
                tr.innerHTML = '' +
                    '<td>' + person.id + '</td>' +
                    '<td>' + person.firstName + '</td>' +
                    '<td>' + person.lastName + '</td>' +
                    '<td>' + (person.birthDate || '') + '</td>' +
                    '<td>' + person.productCount + '</td>';
                tbody.appendChild(tr);
            }

            // Window JSON does not expose hasNext; it exposes `last` instead.
            // If `last` is false, there is another window available.
            hasNext = data.last === false;
            nextCursor = items[items.length - 1].id != null ? items[items.length - 1].id : null;

            const currentScrollHeight = scrollContainer === window
                ? document.body.offsetHeight
                : scrollContainer.scrollHeight;

            console.log('[window.html] state after append', {
                hasNext,
                nextCursor,
                scrollHeight: currentScrollHeight
            });
        } catch (e) {
            console.log('[window.html] error during loadNextPage', e);
            hasNext = false;
            nextCursor = null;
        } finally {
            loading = false;
        }
    }

    function onScroll() {
        const scrollTop = scrollContainer === window
            ? (window.scrollY || window.pageYOffset)
            : scrollContainer.scrollTop;

        const viewportHeightCurrent = scrollContainer === window
            ? window.innerHeight
            : scrollContainer.clientHeight;

        const scrollHeight = scrollContainer === window
            ? document.body.offsetHeight
            : scrollContainer.scrollHeight;

        const scrolledToBottom = viewportHeightCurrent + scrollTop >= scrollHeight - loadThreshold;

        console.log('[window.html] scroll', {
            scrollTop,
            viewportHeight: viewportHeightCurrent,
            scrollHeight,
            scrolledToBottom
        });

        if (scrolledToBottom) {
            loadNextPage('scroll');
        }
    }

    scrollContainer.addEventListener('scroll', onScroll);
    console.log('[window.html] scroll listener attached to',
        scrollContainer === window ? 'window' : '#person-table-container');

    // If initial content is shorter than the viewport, pre-load next window once.
    const initialViewportHeight = scrollContainer === window
        ? window.innerHeight
        : scrollContainer.clientHeight;
    const initialScrollHeight = scrollContainer === window
        ? document.body.offsetHeight
        : scrollContainer.scrollHeight;

    if (initialScrollHeight <= initialViewportHeight && hasNext && nextCursor) {
        console.log('[window.html] auto-loading initial extra page because content < viewport');
        loadNextPage('initial');
    }
});
</script>

</body>
</html>
