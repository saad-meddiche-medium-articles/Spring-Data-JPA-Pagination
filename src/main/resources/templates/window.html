<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Persons - Window (Cursor) Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<nav class="mb-3">
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/page}">Page</a>
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/slice}">Slice</a>
    <a class="btn btn-outline-primary"
       th:href="@{/persons/view/window}">Window</a>
</nav>

<h1>Persons (Keyset / Cursor Pagination)</h1>

<form class="row g-3 mb-3" method="get" th:action="@{/persons/view/window}">
    <input type="hidden" name="lastSeenId" value=""/>
    <div class="col-auto">
        <label for="variant" class="col-form-label">Version:</label>
    </div>
    <div class="col-auto">
        <select id="variant" name="variant" class="form-select" onchange="this.form.submit()">
            <option value="default" th:selected="${variant == 'default'}">default</option>
        </select>
    </div>
</form>

<div class="mb-3">
    <p>
        Cursor-based window (no total count, using <code>lastSeenId</code>)
    </p>
</div>

<table class="table table-striped table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>First name</th>
        <th>Last name</th>
        <th>Product count</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="person : ${items}">
        <td th:text="${person.id}">1</td>
        <td th:text="${person.firstName}">John</td>
        <td th:text="${person.lastName}">Doe</td>
        <td th:text="${person.productCount}">3</td>
    </tr>
    </tbody>
</table>

<nav aria-label="Cursor navigation">
    <ul class="pagination">

        <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
            <a class="page-link"
               th:if="${hasNext}"
               th:href="@{/persons/view/window(lastSeenId=${nextCursor}, variant=${variant})}">
                Next
            </a>
            <span class="page-link" th:unless="${hasNext}">Next</span>
        </li>

    </ul>
</nav>

</body>
</html>
