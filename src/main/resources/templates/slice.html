<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Persons - Slice Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<nav class="mb-3">
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/page}">Page</a>
    <a class="btn btn-outline-primary me-2"
       th:href="@{/persons/view/slice}">Slice</a>
    <a class="btn btn-outline-primary"
       th:href="@{/persons/view/window}">Window</a>
</nav>

<h1>Persons (Slice Pagination without Count)</h1>

<form class="row g-3 mb-3" method="get" th:action="@{/persons/view/slice}">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${slice.size}"/>

    <div class="col-auto">
        <label for="variant" class="col-form-label">Version:</label>
    </div>
    <div class="col-auto">
        <select id="variant" name="variant" class="form-select" onchange="this.form.submit()">
            <option value="slice" th:selected="${variant == 'slice'}">slice</option>
            <option value="improvedSlice" th:selected="${variant == 'improvedSlice'}">improvedSlice</option>
            <option value="sliceWithoutCount" th:selected="${variant == 'sliceWithoutCount'}">sliceWithoutCount</option>
        </select>
    </div>
</form>

<div class="mb-3">
    <p>
        Current slice index:
        <span th:text="${slice.number}">0</span>
        (0-based, size:
        <span th:text="${slice.size}">10</span>)
    </p>
</div>

<table class="table table-striped table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>First name</th>
        <th>Last name</th>
        <th>Product count</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="person : ${slice.content}">
        <td th:text="${person.id}">1</td>
        <td th:text="${person.firstName}">John</td>
        <td th:text="${person.lastName}">Doe</td>
        <td th:text="${person.productCount}">3</td>
    </tr>
    </tbody>
</table>

<nav aria-label="Slice navigation">
    <ul class="pagination">

        <li class="page-item" th:classappend="${!slice.hasPrevious()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/persons/view/slice(page=${slice.number - 1}, size=${slice.size}, variant=${variant})}">
                Previous
            </a>
        </li>

        <li class="page-item" th:classappend="${!slice.hasNext()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/persons/view/slice(page=${slice.number + 1}, size=${slice.size}, variant=${variant})}">
                Next
            </a>
        </li>

    </ul>
</nav>

</body>
</html>
